<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Blank
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <ion-button (click)="openLogOvernight()">Log sleep</ion-button>
    @for (data of allSleepData; track data.id) {
      <p>{{ data.dateString() }}: {{ data.summaryString() }}</p>
    }
  </div>
</ion-content>
