<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Sleep Tracker
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Sleep Tracker</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="page">
    <div class="buttons">
      <ion-button (click)="openLogOvernight()">Log sleep</ion-button>
      <ion-button (click)="openLogSleepiness()">Log sleepiness</ion-button>
    </div>

    <ion-list [inset]="true">
      @for (data of allSleepData; track data.id) {
        <ion-item>
          <ion-label>
            <ion-chip
              [style.--background]="data.typeString() === 'Sleep' ? '#4b3fa8' : '#0f766e'"
              style="--color: #ffffff">
              {{ data.typeString() }}
            </ion-chip>
            <h2>{{ data.dateString() }}</h2>
            <p>{{ data.summaryString() }}</p>
          </ion-label>
          <ion-button slot="end" color="danger" (click)="sleepService.deleteData(data.id)">Delete</ion-button>
        </ion-item>
      }
    </ion-list>
  </div>
</ion-content>
